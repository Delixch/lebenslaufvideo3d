<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Schriften duerfen das Rendern nicht blockieren: haengt fonts.googleapis.com
      im Mobilfunknetz, wartet der Browser sonst bis zum Timeout und die Seite
      bleibt schwarz. media="print" laedt die Datei nebenher, onload schaltet sie
      scharf; ohne JavaScript greift das <noscript>-Fallback.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Montserrat:wght@200;300;400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Herr+Von+Muellerhoff&family=Montserrat:wght@200;300;400;500;600;700&display=swap"
      />
    </noscript>
    <link rel="preload" as="image" href="/hero-poster.jpg" fetchpriority="high" />
    <title>Adnan Aydin — Web-Entwickler in Zürich</title>
    <meta
      name="description"
      content="Adnan Aydin baut Websites mit Charakter: Echtzeit-3D, Motion Design und sauberer Code. Aus Zürich, offen für neue Aufträge."
    />
    <meta name="author" content="Adnan Aydin" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:title" content="Adnan Aydin — Web-Entwickler in Zürich" />
    <meta
      property="og:description"
      content="Websites mit Charakter: Echtzeit-3D, Motion Design und sauberer Code."
    />
  </head>
  <body>
    <!--
      Erste Farbe ohne JavaScript: Poster, Name und Zeile stehen direkt im HTML.
      main.tsx entfernt die Schicht, sobald React gerendert hat. Ohne sie bleibt
      der Bildschirm schwarz, bis das Bundle geladen und ausgefuehrt ist.
    -->
    <div id="boot" aria-hidden="true">
      <div id="boot-poster"></div>
      <div id="boot-copy">
        <p>WEB-ENTWICKLER · ZÜRICH</p>
        <h1>ADNAN AYDIN</h1>
        <span id="boot-bar"><i></i></span>
      </div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #000;
        overflow: hidden;
      }
      #boot-poster {
        position: absolute;
        inset: 0;
        background: url('/hero-poster.jpg') center top / cover no-repeat;
        opacity: 0.55;
        -webkit-mask-image: linear-gradient(to bottom, #000 42%, rgba(0, 0, 0, 0.5) 70%, transparent 92%);
        mask-image: linear-gradient(to bottom, #000 42%, rgba(0, 0, 0, 0.5) 70%, transparent 92%);
      }
      #boot-copy {
        position: absolute;
        left: 1.5rem;
        right: 1.5rem;
        bottom: 18vh;
        font-family: Montserrat, system-ui, sans-serif;
        color: #e8dfd8;
      }
      #boot-copy p {
        margin: 0 0 0.75rem;
        font-size: 0.62rem;
        letter-spacing: 0.3em;
        color: #c4b29e;
      }
      #boot-copy h1 {
        margin: 0;
        font-size: clamp(2.6rem, 12vw, 5rem);
        line-height: 0.9;
        letter-spacing: 0.02em;
        background: linear-gradient(to bottom, #f7e7c4, #c99e5d 60%, #543b1a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-bar {
        display: block;
        width: 6rem;
        height: 1px;
        margin-top: 1.25rem;
        background: rgba(140, 109, 79, 0.5);
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #d4af37;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
    <div id="root"></div>
    <script>
      // Notbremse: bleibt das Bundle aus, verschwindet die Startschicht trotzdem.
      window.__bootStart = Date.now();
      window.__dropBoot = function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        window.__bootRemovedAfter = Date.now() - window.__bootStart;
        boot.style.transition = 'opacity 400ms ease';
        boot.style.opacity = '0';
        setTimeout(function () {
          boot.remove();
        }, 450);
      };
      setTimeout(window.__dropBoot, 3500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
